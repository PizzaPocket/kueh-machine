<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #2b2b2b; }
</style>
</helmet>
<div style="width:390px;height:844px;margin:0 auto;background:#070707;position:relative;overflow:hidden;font-family:'Helvetica Neue',Arial,sans-serif;border-radius:46px;border:1px solid #232323;box-shadow:inset 0 0 0 6px #0c0c0c;display:flex;flex-direction:column;padding:0 26px;">

  <!-- status bar -->
  <div style="display:flex;align-items:center;justify-content:flex-end;padding:16px 0 2px;color:#fff;flex:none;">
    <span style="display:flex;align-items:center;gap:6px;">
      <svg width="17" height="12" viewBox="0 0 18 13"><rect x="0" y="9" width="3" height="4" rx="1" fill="#fff"></rect><rect x="4.5" y="6" width="3" height="7" rx="1" fill="#fff"></rect><rect x="9" y="3" width="3" height="10" rx="1" fill="#fff"></rect><rect x="13.5" y="0" width="3" height="13" rx="1" fill="#fff"></rect></svg>
      <svg width="16" height="12" viewBox="0 0 17 13"><path d="M8.5 2.5c2.6 0 5 1 6.8 2.7l-1.5 1.6A7.6 7.6 0 0 0 8.5 5 7.6 7.6 0 0 0 3.2 6.8L1.7 5.2A9.6 9.6 0 0 1 8.5 2.5Z" fill="#fff"></path><circle cx="8.5" cy="10.5" r="1.7" fill="#fff"></circle></svg>
      <span style="display:inline-flex;align-items:center;gap:2px;"><span style="display:inline-block;width:23px;height:12px;border:1.5px solid rgba(255,255,255,.5);border-radius:3px;position:relative;"><span style="position:absolute;inset:1.5px;width:17px;background:#fff;border-radius:1px;"></span></span><span style="display:inline-block;width:1.5px;height:4px;background:rgba(255,255,255,.5);border-radius:1px;"></span></span>
    </span>
  </div>

  <!-- logo -->
  <div style="margin-top:14px;flex:none;">
    <span style="font-family:'Pixelify Sans',sans-serif;font-weight:600;font-size:26px;color:#c2f02e;letter-spacing:1px;">remember.fm</span>
  </div>

  <!-- sparkles top right -->
  <div style="position:absolute;top:118px;right:54px;font-size:22px;color:#b67bff;">✦</div>
  <div style="position:absolute;top:104px;right:30px;font-size:15px;color:#b67bff;">✦</div>
  <div style="position:absolute;top:140px;right:38px;font-size:13px;color:#b67bff;">✦</div>

  <!-- heading -->
  <div style="margin-top:40px;flex:none;">
    <h1 style="margin:0;font-size:33px;font-weight:700;line-height:1.12;color:#f2f2f2;letter-spacing:-.5px;">When were you<br><span style="white-space:nowrap;">growing up?<svg width="44" height="33" viewBox="0 0 44 32" style="vertical-align:-6px;margin-left:5px;transform:rotate(-14deg);"><path d="M13 5 L13 11" stroke="#d6ff3a" stroke-width="3.2" fill="none" stroke-linecap="round"></path><path d="M28 5 L28 11" stroke="#d6ff3a" stroke-width="3.2" fill="none" stroke-linecap="round"></path><path d="M7 16 C10 28 31 28 35 15" stroke="#d6ff3a" stroke-width="3.2" fill="none" stroke-linecap="round"></path></svg></span></h1>
    <p style="margin:12px 0 0;color:#8f8f8f;font-size:16px;font-weight:400;">We'll build your personal soundtrack.</p>
  </div>

  <!-- form fields -->
  <div style="margin-top:30px;display:flex;flex-direction:column;gap:20px;flex:none;">
    <div>
      <div style="font-family:'Helvetica Neue',Arial,sans-serif;color:#c2f02e;font-weight:700;font-size:15px;margin-bottom:9px;">Birth year</div>
      <div style="position:relative;height:58px;border-radius:16px;background:linear-gradient(180deg,#1d1d1d,#0e0e0e);border:1px solid #2c2c2c;box-shadow:inset 0 1px 0 rgba(255,255,255,.05);display:flex;align-items:center;padding:0 20px;">
        <span style="color:#fff;font-weight:700;font-size:22px;">1993</span>
        <svg width="20" height="20" viewBox="0 0 24 24" style="position:absolute;right:20px;"><path d="M12 2 L14 10 L22 12 L14 14 L12 22 L10 14 L2 12 L10 10 Z" fill="#c2f02e"></path></svg>
      </div>
    </div>
    <div>
      <div style="color:#c2f02e;font-weight:700;font-size:15px;margin-bottom:9px;">Country</div>
      <div style="position:relative;height:58px;border-radius:16px;background:linear-gradient(180deg,#1d1d1d,#0e0e0e);border:1px solid #2c2c2c;box-shadow:inset 0 1px 0 rgba(255,255,255,.05);display:flex;align-items:center;padding:0 20px;">
        <span style="color: #ffffff; font-weight: 700; font-size: 21px">Malaysia</span>
        <svg width="16" height="16" viewBox="0 0 16 16" style="position:absolute;right:20px;"><path d="M3 5 L8 11 L13 5 Z" fill="#a86bff"></path></svg>
      </div>
    </div>
    <div>
      <div style="color:#c2f02e;font-weight:700;font-size:15px;margin-bottom:9px;">Language you listen to</div>
      <div style="position:relative;height:58px;border-radius:16px;background:linear-gradient(180deg,#1d1d1d,#0e0e0e);border:1px solid #2c2c2c;box-shadow:inset 0 1px 0 rgba(255,255,255,.05);display:flex;align-items:center;padding:0 20px;">
        <span style="color: #ffffff; font-weight: 700; font-size: 21px">English, Chinese</span>
        <svg width="16" height="16" viewBox="0 0 16 16" style="position:absolute;right:20px;"><path d="M3 5 L8 11 L13 5 Z" fill="#a86bff"></path></svg>
      </div>
    </div>
  </div>

  <!-- photo collage (matches reference) -->
  <div style="position:relative;flex:1;min-height:120px;display:flex;align-items:flex-end;justify-content:center;">
    <img src="assets/collage.png" alt="retro collage" style="display:block;width:100%;height:100%;object-fit:contain;object-position:center bottom;">
  </div>

  <!-- button -->
  <div style="position:relative;padding-bottom:28px;flex:none;margin-top:-4px;">
    <button style="width:100%;border:none;cursor:pointer;background:#c2f02e;border-radius:16px;padding:18px;font-family:'Pixelify Sans',sans-serif;font-weight:600;font-size:25px;color:#0a0a0a;box-shadow:0 6px 0 #6f8a14, inset 0 0 0 2px rgba(0,0,0,.15);letter-spacing:1px;">build my timeline</button>
    <svg width="28" height="34" viewBox="0 0 34 40" style="position:absolute;right:14px;bottom:8px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.6));"><path d="M4 2 L4 30 L11 23 L16 34 L21 32 L16 21 L26 21 Z" fill="#fff" stroke="#0a0a0a" stroke-width="2" stroke-linejoin="round"></path></svg>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}"></script>
</body>
</html>
