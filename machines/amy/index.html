<div class="scene">

  <header class="site-header">
    <h1 class="logo">ガチャ ガチャ クエ</h1>
    <p class="logo-subtext">gacha gacha kueh</p>
  </header>

  <main class="stage">

    <section class="machine-view" id="machineView">

      <div class="machine" id="machine">
        <img class="machine-art" src="./assets/gacha-machine.svg" alt="Illustration of the kueh gachapon machine" />

        <button class="knob-btn" id="knobBtn" type="button" aria-label="Turn the knob" disabled></button>

        <button class="capsule" id="capsuleBtn" type="button" aria-label="Open capsule" hidden>
          <svg viewBox="0 0 80 80" aria-hidden="true" focusable="false">
            <use id="capsuleUse" href="#capsule-blue" width="80" height="80" />
          </svg>
        </button>
      </div>

      <p class="microcopy" id="microcopy" aria-live="polite">Insert a coin to begin</p>

      <div class="controls">
        <button class="control-btn coin-btn" id="coinBtn" type="button">
          <svg viewBox="0 0 40 40" aria-hidden="true" focusable="false">
            <circle cx="20" cy="20" r="17" />
            <text x="20" y="26" text-anchor="middle">$</text>
          </svg>
          <span>Insert Coin</span>
        </button>
      </div>

    </section>

    <section class="reveal-view" id="revealView" hidden>
      <div class="reveal-card" id="revealCard">
        <div class="kueh-art" id="kuehArt"></div>
        <h2 class="kueh-name" id="kuehName"></h2>
        <p class="kueh-desc" id="kuehDesc"></p>
        <dl class="kueh-meta">
          <div>
            <dt>Taste</dt>
            <dd id="kuehTaste"></dd>
          </div>
          <div>
            <dt>History</dt>
            <dd id="kuehHistory"></dd>
          </div>
        </dl>
        <div class="reveal-actions">
          <button class="btn-primary" id="againBtn" type="button">Gacha again!</button>
        </div>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <p>Kueh Machine — built by Amy, for kuehmachine.com</p>
  </footer>

</div>

<!-- No persistent header here to dock into — floats top-right (default).
     accentColor matches --coral (css/style.css), one of the gachapon
     machine's own capsule colors. Loaded before data.js/app.js (matching
     Ken's/Ruth's/Liwei's own script order) — app.js reads window.KuehAccount
     at its own top level to sync the kueh collection with the signed-in
     account, so it needs to already exist by then. -->
<script src="/shared/account-widget.js" data-accent-color="#d97b66"></script>
<script src="./js/data.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
