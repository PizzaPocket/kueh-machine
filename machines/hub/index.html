<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Kueh-verse — Kueh Machine</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #ffffff;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}


/* Kueh-verse's only loading surface: the real Godot download progress. */
#status {
	background: #ffffff;
	gap: 24px;
	/* Just below account-widget.js's own hardcoded badge z-index (2147483000,
	   not something this page controls) rather than the previous
	   2147483646 -- per direct instruction, the account button should show
	   through the loading screen the same way it does on the landing page,
	   which a higher z-index here was silently hiding it behind. Still far
	   above the canvas/everything else on the page. */
	z-index: 2147482999;
}

/* Same wordmark markup/look as the root landing page's own .landing-header
   .wordmark, per direct instruction -- a child of #status rather than a
   separate persistent header, so it shares #status's own show/hide
   lifecycle (setStatusMode('hidden') below) instead of lingering once
   loading finishes and gameplay starts. */
.wordmark {
	position: absolute;
	top: 24px;
	left: 32px;
	color: #B72E68;
	font-family: Syne, Arial, sans-serif;
	font-size: 16px;
	letter-spacing: -0.025em;
	line-height: 1;
	text-decoration: none;
}

.wordmark-kueh { font-weight: 800; }
.wordmark-machine { font-weight: 600; }

#status-progress {
	appearance: none;
	-webkit-appearance: none;
	position: absolute;
	bottom: 10%;
	/* Absolute positioning takes this out of #status's own centered flex
	   flow, so it needs its own explicit horizontal centering -- without
	   it the bar fell back to its flex static position, which read as
	   weighted toward the left instead of centered. */
	left: 50%;
	transform: translateX(-50%);
	width: min(420px, calc(100vw - 64px));
	height: 4px;
	margin: 0;
	border: 0;
	border-radius: 2px;
	background: #dedbd4;
	overflow: hidden;
}

#status-progress::-webkit-progress-bar {
	background: #dedbd4;
}

#status-progress::-webkit-progress-value {
	background: #171311;
}

#status-progress::-moz-progress-bar {
	background: #171311;
}

#loading-controls {
	display: none;
	position: absolute;
	top: 50%;
	left: 50%;
	width: min(760px, calc(100vw - 64px));
	transform: translate(-50%, -50%);
	color: #5c564e;
	font-family: Syne, Arial, sans-serif;
	font-size: 16px;
	font-weight: 600;
	line-height: 1.4;
	text-align: center;
}

.loader-desktop {
	display: flex;
	align-items: center;
	justify-content: center;
	gap: 54px;
}

.loader-control {
	display: flex;
	min-width: 150px;
	flex-direction: column;
	align-items: center;
	gap: 14px;
}

.loader-wasd {
	display: grid;
	grid-template-columns: repeat(3, 38px);
	grid-template-rows: repeat(2, 38px);
	gap: 5px;
}

.loader-wasd .key:first-child {
	grid-column: 2;
	grid-row: 1;
}

.loader-wasd .key:nth-child(2) { grid-column: 1; grid-row: 2; }
.loader-wasd .key:nth-child(3) { grid-column: 2; grid-row: 2; }
.loader-wasd .key:nth-child(4) { grid-column: 3; grid-row: 2; }

.key,
.mouse-control {
	display: flex;
	align-items: center;
	justify-content: center;
	box-sizing: border-box;
	border: 1px solid #aaa59c;
	background: #f4f2ed;
	color: #171311;
	font: inherit;
}

.key {
	width: 38px;
	height: 38px;
	border-radius: 10px;
}

.space-key {
	width: 142px;
	height: 38px;
	border-radius: 10px;
	font-size: 12px;
	letter-spacing: 0.08em;
}

.mouse-control {
	width: 52px;
	height: 70px;
	border-radius: 24px;
	/* Overrides the shared .key/.mouse-control center alignment above --
	   per direct correction, a vertically-centered line just reads as a
	   mouse cut in half, not a scroll wheel; shifted toward the top of the
	   shape (padding-top, not touching the border) reads more like one. */
	align-items: flex-start;
	padding-top: 16px;
}

.mouse-control::before {
	content: '';
	width: 2px;
	height: 14px;
	border-radius: 1px;
	background: #171311;
}

.loader-mobile {
	display: none;
	flex-direction: column;
	align-items: center;
	gap: 24px;
}

/* Reconciled with the real in-game joystick's own colors/shape/shadow
   (hub_ui.gd's _squircle_style(): outer Color(0.16,0.11,0.07,0.48), knob
   Color(0.97,0.93,0.85,0.90), corner_ratio 0.34, shadow_size 5 @ 22%
   black) -- this tooltip previously had the light/dark relationship
   backwards (light outer ring, near-black knob) instead of the real
   widget's dark ring with a light knob. Solid hex approximations below are
   those same colors alpha-composited over this loading screen's own white
   background, not just guessed. Border dropped in favor of the shadow
   alone, matching the real widget having no separate stroke.
   corner-shape/border-radius: 34% already matched corner_ratio -- left
   alone. */
.loader-joystick {
	position: relative;
	width: 156px;
	height: 156px;
	border-radius: 34%;
	corner-shape: squircle;
	background: #98928d;
	box-shadow: 0 2px 5px rgba(0, 0, 0, 0.22);
}

.loader-joystick::after {
	content: '';
	position: absolute;
	top: 50%;
	left: 50%;
	width: 68px;
	height: 68px;
	border-radius: 34%;
	corner-shape: squircle;
	background: #f8efdd;
	/* A gentle, looping drift within the outer ring -- per direct
	   instruction, hints the knob is draggable rather than sitting
	   perfectly still and reading as a fixed icon. The forward/back drift
	   itself still takes the original 2.6s (same keyframe shape, just
	   compressed into the first half of a longer cycle); the second half
	   holds at center as an explicit pause before the next cycle, per
	   direct follow-up instruction that the original loop's pause read as
	   too short. */
	animation: loader-joystick-nudge 5.2s ease-in-out infinite;
}

@keyframes loader-joystick-nudge {
	0%, 50%, 100% { transform: translate(-50%, -50%); }
	12.5% { transform: translate(calc(-50% - 15px), calc(-50% - 11px)); }
	25% { transform: translate(-50%, -50%); }
	37.5% { transform: translate(calc(-50% + 15px), calc(-50% + 11px)); }
}

/* Narrow width OR touch-primary/no-hover, not narrow width alone -- a
   tablet in landscape is comfortably wider than 700px but still has no
   keyboard/mouse, so a width-only query left it showing the WASD/mouse
   hint. (hover: none) and (pointer: coarse) reflects the actual input
   hardware regardless of window size, matching ui_kit.gd's own
   is_mobile_viewport() (DisplayServer.is_touchscreen_available()). */
@media (max-width: 700px), (hover: none) and (pointer: coarse) {
	.loader-desktop { display: none; }
	.loader-mobile { display: flex; }
}
		</style>
		<link rel="icon" type="image/svg+xml" href="../../favicon.svg">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<a class="wordmark" href="/" aria-label="Kueh Machine home"><span class="wordmark-kueh">Kueh</span> <span class="wordmark-machine">Machine</span></a>
			<progress id="status-progress"></progress>
			<div id="loading-controls">
				<div class="loader-desktop">
					<div class="loader-control">
						<div class="loader-wasd" aria-hidden="true"><span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span></div>
						<span>Use WASD to move</span>
					</div>
					<div class="loader-control">
						<div class="mouse-control" aria-hidden="true"></div>
						<span>Click to control the camera with the mouse</span>
					</div>
					<div class="loader-control">
						<div class="key space-key" aria-hidden="true">SPACE</div>
						<span>Press Spacebar to jump</span>
					</div>
				</div>
				<div class="loader-mobile">
					<div class="loader-joystick" aria-hidden="true"></div>
					<span>Drag the joystick to move</span>
				</div>
			</div>
			<div id="status-notice"></div>
		</div>

		<script src="/shared/account-widget.js" data-anchor="top-right"></script>
		<script src="/shared/character-system.js"></script>
		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":905624,"index.wasm":39513091},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');
	const loadingControls = document.getElementById('loading-controls');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		loadingControls.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		window.getKuehCharacterBootstrapJson = function () {
			const state = window.KuehCharacters ? window.KuehCharacters.getState() : {};
			return JSON.stringify({
				userId: state.userId || '',
				appearance: state.appearance || {},
				ownedContributorKey: state.contributor ? state.contributor.contributor_key : '',
				contributors: window.KuehCharacters ? window.KuehCharacters.getResolvedContributors() : [],
			});
		};
		window.kuehCharacterEditorRequested = false;
		window.consumeKuehCharacterEditorRequest = function () {
			if (!window.kuehCharacterEditorRequested) return false;
			window.kuehCharacterEditorRequested = false;
			return true;
		};
		window.saveKuehCharacterJson = function (json) {
			window.kuehCharacterSaveState = 'saving';
			window.kuehCharacterSaveError = '';
			try {
				const appearance = JSON.parse(json);
				window.KuehCharacters.saveAppearance(appearance).then(function () {
					window.kuehCharacterSaveState = 'saved';
				}, function (error) {
					window.kuehCharacterSaveError = error && error.message ? error.message : String(error);
					window.kuehCharacterSaveState = 'error';
				});
			} catch (error) {
				window.kuehCharacterSaveError = error && error.message ? error.message : String(error);
				window.kuehCharacterSaveState = 'error';
			}
		};
		if (window.KuehCharacters) window.KuehCharacters.enableEditorMenuAction();
		const characterReady = window.KuehCharacters
			? window.KuehCharacters.refresh().catch((error) => console.warn('[Kueh-verse] using bundled character defaults:', error))
			: Promise.resolve();
		characterReady.then(() => engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		})).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
